name: Release checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run pricing and booking tests
        run: |
          node tests/seasonal-integration.cjs
          node tests/contract-smoke.cjs
          node --check seasonal-pricing.js

      - name: Verify production backend compatibility
        run: |
          endpoint="$(node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const sandbox = { window: {} };
          vm.runInNewContext(fs.readFileSync('config.js', 'utf8'), sandbox);
          process.stdout.write(sandbox.window.CAT_STAY_CONFIG?.bookingEndpoint || '');
          NODE
          )"

          case "$endpoint" in
            https://script.google.com/macros/s/*/exec) ;;
            *) echo "Invalid production Apps Script endpoint" >&2; exit 1 ;;
          esac

          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --max-time 30 \
            "$endpoint" -o /tmp/backend-health.json

          node - <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/backend-health.json', 'utf8'));
          if (health.ok !== true) throw new Error('Production backend health check failed');
          const compatibleReleases = new Set([
            'cny-2027-production-r7',
          ]);
          if (!compatibleReleases.has(health.release)) {
            throw new Error(`Unexpected backend release: ${health.release || 'missing'}`);
          }
          if (health.pricingVersion !== 'cny-2027-v2') {
            throw new Error(`Unexpected pricing version: ${health.pricingVersion || 'missing'}`);
          }
          if (health.emailNotificationConfigured !== true) {
            throw new Error('Production email notifications are not configured');
          }
          if (health.paymentAccountConfigured !== true) {
            throw new Error('Production payment account is not configured');
          }
          console.log(`Backend ready: ${health.release} / ${health.pricingVersion}`);
          NODE
